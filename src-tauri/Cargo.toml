[package]
name = "image-enhancer"
version = "0.1.0"
description = "Image Enhancement and Recoloring Application"
authors = ["You"]
license = ""
repository = ""
default-run = "image-enhancer"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open"] }
image = "0.24"
rayon = "1.7"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[[bin]]
name = "image-enhancer"
path = "src/main.rs"
